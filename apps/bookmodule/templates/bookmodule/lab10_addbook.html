<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Book - Lab 10</title>
</head>
<body>
    <h2>Add a New Book (Part 1: Manual Form)</h2>
    
    <!-- تأكد أن الأكشن يوجه لنفس المسار في urls.py -->
    <form method="POST" action="{% url 'books:lab10_addbook' %}">
        {% csrf_token %} <!-- حماية ضرورية من ديجانجو -->
        
        <div>
            <label>Book Title:</label><br>
            <input type="text" name="title" required>
        </div><br>

        <div>
            <label>Price:</label><br>
            <input type="number" step="0.01" name="price" required>
        </div><br>

        <div>
            <label>Quantity:</label><br>
            <input type="number" name="quantity" required>
        </div><br>

        <div>
            <label>Rating (1-5):</label><br>
            <input type="number" name="rating" min="1" max="5" required>
        </div><br>

        <button type="submit">Save Book</button>
        <a href="{% url 'books:lab10_listbooks' %}">Cancel</a>
    </form>
</body>
</html>
