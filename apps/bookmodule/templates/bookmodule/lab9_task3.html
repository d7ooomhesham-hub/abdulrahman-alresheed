<h3>Task 3: Oldest Book Date per Publisher</h3>
<table border="1">
    <tr>
        <th>Publisher Name</th>
        <th>Oldest Book Publication Date</th>
    </tr>
    {% for pub in publishers %}
    <tr>
        <td>{{ pub.name }}</td>
        <td>{{ pub.oldest_book_date|date:"Y-m-d"|default:"No books" }}</td>
    </tr>
    {% endfor %}
</table>
<a href="{% url 'books:index' %}">Back Home</a>
