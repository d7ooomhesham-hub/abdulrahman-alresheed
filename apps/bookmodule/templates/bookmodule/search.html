{% extends "layouts/base.html" %}

{% block content %}
<div style="padding: 20px;">
    <h2>Search for a Book</h2>
    <form method="post" action="{% url 'books:search_books' %}">
        {% csrf_token %}
        <p>
            <label>Keywords:</label>
            <input type="text" name="keyword" required>
        </p>
        <p>
            <input type="checkbox" name="option1" id="t"><label for="t">Title</label>
            <input type="checkbox" name="option2" id="a"><label for="a">Author</label>
        </p>
        <button type="submit">Search</button>
    </form>
</div>
{% endblock %}
